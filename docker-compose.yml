services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: pipepipe-builder:latest
    volumes:
      - ./PipePipeClient:/app/PipePipeClient
      - ./PipePipeExtractor:/app/PipePipeExtractor
      - ./gradle-cache:/root/.gradle
      - ./build-cache:/app/PipePipeClient/app/build
      - ./outputs:/outputs
    environment:
      - GRADLE_USER_HOME=/root/.gradle
      - ANDROID_HOME=/opt/android-sdk
    command:
      - bash
      - -c
      - |
        cd /app/PipePipeClient
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --build-cache
        cp -f app/build/outputs/apk/debug/*.apk /outputs/
        echo "✓ Build complete! APK saved to ./outputs/"
    working_dir: /app/PipePipeClient
